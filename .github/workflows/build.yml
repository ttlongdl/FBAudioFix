name: Build Rootless DEB

on:
  push:
    branches:
      - main
    paths:
      - "Tweak.xm"
      - "Makefile"
      - "control"
      - "FBAudioFix.plist"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          ls -lah packages

      - name: Read package version
        id: version
        run: |
          VERSION="$(awk '/^Version:/{print $2; exit}' control)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FBAudioFix-${{ steps.version.outputs.version }}-rootless
          path: packages/*.deb
          retention-days: 7
          if-no-files-found: error
